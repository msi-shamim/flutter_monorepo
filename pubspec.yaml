name: flutter_monorepo
description: >-
  Bootstrap a production-ready Flutter monorepo in one command. Choose state
  management (GetX/Riverpod/Bloc/Cubit), HTTP client, locales, and platforms.
version: 1.0.0
homepage: https://github.com/msi-shamim/flutter_monorepo
repository: https://github.com/msi-shamim/flutter_monorepo
issue_tracker: https://github.com/msi-shamim/flutter_monorepo/issues
license: MIT

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  flutter_monorepo: flutter_monorepo
