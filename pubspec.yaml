name: flutter_monorepo
description: >-
  CLI tool to bootstrap a production-ready Flutter monorepo with your choice
  of state management (GetX, Riverpod, Bloc, Cubit), HTTP client (Dio, http,
  Chopper), locales, and platforms — in one command. Auto-resolves latest
  compatible dependency versions from pub.dev.
version: 1.0.0
homepage: https://github.com/msi-shamim/flutter_monorepo
repository: https://github.com/msi-shamim/flutter_monorepo
issue_tracker: https://github.com/msi-shamim/flutter_monorepo/issues
license: MIT

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  flutter_monorepo: flutter_monorepo
